spring:
  datasource:
    # Defaults match docker-compose.yml for local development; any other environment sets them
    # through environment variables. Credentials never go to the repository or the logs.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:athlete_atlas}?reWriteBatchedInserts=true
    username: ${DB_USERNAME:athlete_atlas}
    password: ${DB_PASSWORD:athlete_atlas}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Hikari durations are milliseconds. Fail fast (3 s) when the pool is exhausted instead of
      # piling up waiting threads; renew connections every 30 min.
      connection-timeout: 3000
      max-lifetime: 1800000
      # No query of this schema should take longer; cuts the ones that hang.
      connection-init-sql: SET statement_timeout = '5s'
  jpa:
    # Releases the connection when the repository call ends, not when the HTTP response is written.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  cache:
    type: caffeine
    cache-names: athletes, confirmedCompetitions, hallOfFame
    caffeine:
      # Entries are evicted when the data is written; the TTL only covers changes made outside the
      # backend (e.g. SQL). recordStats exposes hits, misses and size in Prometheus.
      spec: maximumSize=500,expireAfterWrite=10m,recordStats

app:
  # Zone of the API contract for local dates (competition season, season-start-cron), whatever
  # the time zone of the server. Instants (updatedAt) are always served in UTC.
  time-zone: Europe/Madrid

rest-clients:
  ifbb-pro:
    base-url: https://www.ifbbpro.com
    connect-timeout: 2s
    read-timeout: 5s
    # Value documented in the IFBB consumer contract (ifbb-pro-api.yaml).
    user-agent: KimAngelWebsite/1.0
    page-size: 50
    max-pages: 200
  youtube:
    base-url: https://www.googleapis.com/youtube/v3
    # Server-side only. Sent in the X-goog-api-key header, never in URLs or logs. Empty: refreshes fail
    # and the endpoint answers 503 until a key is configured.
    api-key: ${YOUTUBE_API_KEY:}
    connect-timeout: 5s
    read-timeout: 30s
    page-size: 50
    max-pages: 4
    selection-size: 6
  instagram:
    base-url: https://graph.facebook.com
    api-version: v26.0
    # Instagram business account authorized to run Business Discovery.
    authorized-account-id: ${INSTAGRAM_AUTHORIZED_ACCOUNT_ID:}
    # Server-side only. Sent as Authorization Bearer header, never in URLs or logs. It expires and
    # must be renewed outside the backend. Empty: refreshes fail and the endpoint answers 503.
    access-token: ${INSTAGRAM_ACCESS_TOKEN:}
    connect-timeout: 5s
    read-timeout: 30s
    media-limit: 50
    selection-size: 3

competitions:
  # Requests are served from the stored catalog and never call the IFBB website.
  refresh-initial-delay: 0s
  refresh-interval: 6h
  # Extra refresh when a new season begins (October 1, app.time-zone), so that the calendar of
  # the new season does not wait up to refresh-interval to be available.
  season-start-cron: "0 0 0 1 10 *"
  # A catalog older than this is reported as stale even if its last refresh succeeded.
  freshness-threshold: 12h

youtube:
  # The channel of each athlete is stored in the athlete table (column youtube_channel_id).
  # Replaces the GitHub Actions workflow of the current website, which runs every six hours.
  refresh-initial-delay: 0s
  refresh-interval: 6h
  # A selection older than this is reported as stale even if its last refresh succeeded.
  freshness-threshold: 12h

instagram:
  # The username of each athlete is stored in the athlete table (column instagram_username).
  # Replaces the GitHub Actions workflow of the current website, which runs every six hours.
  refresh-initial-delay: 0s
  refresh-interval: 6h
  # A selection older than this is reported as stale even if its last refresh succeeded.
  freshness-threshold: 12h

resilience4j:
  retry:
    instances:
      # Applied per request in YouTubeDataClient: 3 attempts waiting 1s and 2s, as the former script.
      youTubeDataApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.HttpServerErrorException$InternalServerError
          - org.springframework.web.client.HttpServerErrorException$BadGateway
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.HttpServerErrorException$GatewayTimeout
          - org.springframework.web.client.ResourceAccessException
      # Applied per request in InstagramGraphClient: 3 attempts waiting 1s and 2s, as the former script.
      instagramGraphApi:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.HttpServerErrorException$InternalServerError
          - org.springframework.web.client.HttpServerErrorException$BadGateway
          - org.springframework.web.client.HttpServerErrorException$ServiceUnavailable
          - org.springframework.web.client.HttpServerErrorException$GatewayTimeout
          - org.springframework.web.client.ResourceAccessException
      # Applied per page in IfbbEventsClient. Only transient failures are retried, as the IFBB
      # contract states: 429, 5xx and network errors. Other 4xx fail immediately.
      ifbbEventsApi:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      ifbbEventsApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Only provider unavailability opens the circuit; a 4xx caused by our request does not.
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.ResourceAccessException
