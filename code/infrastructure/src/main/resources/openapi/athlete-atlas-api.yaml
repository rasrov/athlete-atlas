openapi: 3.0.3
info:
  title: Athlete Public API
  version: 0.1.0
  description:
    This API provides athlete-related data for public consumption. It includes endpoints for retrieving competition
    participation, Instagram posts, YouTube videos, and sponsor information. The API is designed to be used
    by frontend applications and other services that require athlete data.
servers:
- url: 'http://localhost:8080'
  description: Local development server
security: []
tags:
- name: Competition
  description: Competition calendar and editorial participation decisions
- name: InstagramPost
  description: Instagram posts and preview images
- name: YouTubeVideo
  description: YouTube video metadata and links
- name: Sponsor
  description: Athlete sponsors and discount codes
paths:
  /api/v1/athletes/{athleteId}/competitions:
    get:
      operationId: listAthleteCompetitions
      tags:
      - Competition
      summary: List competitions with athlete participation
      description: Sort by startDate ascending, then id ascending. Include professional Classic Physique
        events; exclude names containing natural and Natural/Naturals words in Classic Physique division
        lines, retaining Masters. Participation belongs to this athlete and event edition, not another
        year. Default to pending when no editorial decision exists. The backend fixes the calendar window
        from September 1 of the current calendar year (inclusive) to September 1 of the following year
        (exclusive). Determine the current year once per request using Europe/Madrid, including requests
        made before September. For requests in 2026, windowStart is 2026-09-01 and windowEndExclusive
        is 2027-09-01. Include overlapping events when endDate >= windowStart and startDate < windowEndExclusive;
        event endDate remains inclusive. Apply this window and participationStatus with AND before counting
        and pagination. Only limit, offset and participationStatus query parameters are supported; reject
        from, to and any other query parameter with 400.
      parameters:
      - $ref: '#/components/parameters/AthleteId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/Offset'
      - name: participationStatus
        in: query
        schema:
          $ref: '#/components/schemas/ParticipationStatus'
        description: Omit to include all statuses. Use confirmed to select competitions where the athlete
          participates.
      responses:
        '200':
          description: Available collection; data may be empty. Fictional example, not evidence of actual
            results or sponsorship agreements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionCollection'
              example:
                data:
                - id: competition-example-2026
                  name: Example Pro 2026
                  startDate: '2026-10-10'
                  endDate: '2026-10-11'
                  city: Madrid
                  country: Spain
                  description: Classic Physique
                  sourceUrl: https://www.ifbbpro.com/competition/example/
                  sourceId: '12345'
                  logoUrl: null
                  participation:
                    status: pending
                pagination:
                  limit: 50
                  offset: 0
                  total: 1
                  hasMore: false
                meta:
                  athleteId: kim-angel
                  updatedAt: null
                  availability: unknown
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/athletes/{athleteId}/instagram/posts:
    get:
      operationId: listAthleteInstagramPosts
      tags:
      - InstagramPost
      summary: Get the latest 3 Instagram posts
      description: Return exactly 3 distinct eligible posts from the latest complete synchronized selection,
        ordered by publishedAt descending, then id ascending. No query parameters are supported; reject
        limit, offset or any other query parameter with 400. A post may be an image, carousel or video
        with one optional preview image. Do not serve media binaries or promise permanent CDN URLs. Preserve
        the permalink when the preview is unavailable. If fewer than 3 eligible posts are available, retain
        the previous complete selection as stale or return 503 when no complete selection exists. Never
        return a partial or empty 200 response.
      parameters:
      - $ref: '#/components/parameters/AthleteId'
      responses:
        '200':
          description: Exactly 3 distinct items in the complete selection. Preview images may be null;
            missing previews do not reduce the item count. Fictional examples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramPostCollection'
              example:
                data:
                - id: '12345678901234567'
                  mediaType: VIDEO
                  publishedAt: '2026-10-07T12:00:00Z'
                  permalink: https://www.instagram.com/reel/EXAMPLE1/
                  previewImageUrl: null
                - id: '12345678901234568'
                  mediaType: IMAGE
                  publishedAt: '2026-10-06T12:00:00Z'
                  permalink: https://www.instagram.com/p/EXAMPLE2/
                  previewImageUrl: null
                - id: '12345678901234569'
                  mediaType: CAROUSEL_ALBUM
                  publishedAt: '2026-10-05T12:00:00Z'
                  permalink: https://www.instagram.com/p/EXAMPLE3/
                  previewImageUrl: null
                meta:
                  athleteId: kim-angel
                  updatedAt: null
                  availability: unknown
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/athletes/{athleteId}/youtube/videos:
    get:
      operationId: listAthleteYouTubeVideos
      tags:
      - YouTubeVideo
      summary: Get the latest 6 YouTube videos
      description: Return exactly 6 distinct eligible videos ordered by publishedAt descending, then id
        ascending. Only public and embeddable videos according to the last synchronization; exclude future
        publications, upcoming streams and live broadcasts. Include Shorts without inferring their format
        from duration. No query parameters are supported; reject limit, offset or any other query parameter
        with 400. Provide watch/embed URLs, not video downloads. Availability can change after synchronization.
        If fewer than 6 eligible videos are available, retain the previous complete selection as stale
        or return 503 when no complete selection exists. Never return a partial or empty 200 response.
      parameters:
      - $ref: '#/components/parameters/AthleteId'
      responses:
        '200':
          description: Exactly 6 distinct items in the complete selection. Preview images may be null;
            missing previews do not reduce the item count. Fictional examples.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YouTubeVideoCollection'
              example:
                data:
                - id: AbCdEfGhI00
                  title: Example video 1
                  publishedAt: '2026-10-07T12:00:00Z'
                  watchUrl: https://www.youtube.com/watch?v=AbCdEfGhI00
                  embedUrl: https://www.youtube-nocookie.com/embed/AbCdEfGhI00
                  thumbnailUrl: null
                - id: AbCdEfGhI01
                  title: Example video 2
                  publishedAt: '2026-10-06T12:00:00Z'
                  watchUrl: https://www.youtube.com/watch?v=AbCdEfGhI01
                  embedUrl: https://www.youtube-nocookie.com/embed/AbCdEfGhI01
                  thumbnailUrl: null
                - id: AbCdEfGhI02
                  title: Example video 3
                  publishedAt: '2026-10-05T12:00:00Z'
                  watchUrl: https://www.youtube.com/watch?v=AbCdEfGhI02
                  embedUrl: https://www.youtube-nocookie.com/embed/AbCdEfGhI02
                  thumbnailUrl: null
                - id: AbCdEfGhI03
                  title: Example video 4
                  publishedAt: '2026-10-04T12:00:00Z'
                  watchUrl: https://www.youtube.com/watch?v=AbCdEfGhI03
                  embedUrl: https://www.youtube-nocookie.com/embed/AbCdEfGhI03
                  thumbnailUrl: null
                - id: AbCdEfGhI04
                  title: Example video 5
                  publishedAt: '2026-10-03T12:00:00Z'
                  watchUrl: https://www.youtube.com/watch?v=AbCdEfGhI04
                  embedUrl: https://www.youtube-nocookie.com/embed/AbCdEfGhI04
                  thumbnailUrl: null
                - id: AbCdEfGhI05
                  title: Example video 6
                  publishedAt: '2026-10-02T12:00:00Z'
                  watchUrl: https://www.youtube.com/watch?v=AbCdEfGhI05
                  embedUrl: https://www.youtube-nocookie.com/embed/AbCdEfGhI05
                  thumbnailUrl: null
                meta:
                  athleteId: kim-angel
                  updatedAt: null
                  availability: unknown
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/athletes/{athleteId}/sponsors:
    get:
      operationId: listAthleteSponsors
      tags:
      - Sponsor
      summary: List athlete sponsors
      description: Include active editorial sponsorship relationships only. Sort by displayOrder ascending,
        then id ascending. Discount codes belong to the athlete relationship and are null when absent;
        do not invent benefits or discount percentages.
      parameters:
      - $ref: '#/components/parameters/AthleteId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Available collection; data may be empty. Fictional example, not evidence of actual
            results or sponsorship agreements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SponsorCollection'
              example:
                data:
                - id: sponsor-example
                  name: Example sponsor
                  websiteUrl: https://example.com/
                  logoUrl: https://example.com/logo.png
                  discountCode: null
                  displayOrder: 0
                pagination:
                  limit: 50
                  offset: 0
                  total: 1
                  hasMore: false
                meta:
                  athleteId: kim-angel
                  updatedAt: null
                  availability: unknown
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '503':
          $ref: '#/components/responses/Error503'
components:
  parameters:
    AthleteId:
      name: athleteId
      in: path
      required: true
      description: Backend-configured identifier. kim-angel is the proposed initial value; unknown athletes
        return 404.
      schema:
        $ref: '#/components/schemas/Id'
      example: kim-angel
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Offset within the filtered results. An offset beyond the total returns an empty data
        array.
  responses:
    Error400:
      description: Invalid parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Invalid parameters
            status: 400
            detail: Invalid parameters. No credentials or internal provider responses are exposed.
    Error404:
      description: Athlete not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Athlete not found
            status: 404
            detail: Athlete not found. No credentials or internal provider responses are exposed.
    Error429:
      description: Too many requests
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Too many requests
            status: 429
            detail: Too many requests. No credentials or internal provider responses are exposed.
      headers:
        Retry-After:
          description: Optional suggested delay in seconds before retrying.
          schema:
            type: integer
            minimum: 0
    Error503:
      description: Data temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Data temporarily unavailable
            status: 503
            detail: Data temporarily unavailable. No credentials or internal provider responses are exposed.
      headers:
        Retry-After:
          description: Optional suggested delay in seconds before retrying.
          schema:
            type: integer
            minimum: 0
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      description: Opaque API identifier. Do not derive identity from name similarity or assume it equals
        a provider ID.
    ParticipationStatus:
      type: string
      enum:
      - pending
      - confirmed
      - absent
      description: 'pending: no editorial decision; confirmed: participating; absent: not participating.
        Do not infer absent from incomplete external lists.'
    Participation:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/ParticipationStatus'
    Competition:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - startDate
      - endDate
      - city
      - country
      - description
      - sourceUrl
      - sourceId
      - logoUrl
      - participation
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Inclusive, >= startDate. Local event dates; do not convert to UTC or infer the
            date of category finals.
        city:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
        description:
          type: string
          description: Plain text, without HTML.
        sourceUrl:
          type: string
          format: uri
          pattern: ^https://
        sourceId:
          type: string
          minLength: 1
          description: IFBB ID represented as a string, separate from the API ID.
        logoUrl:
          type: string
          format: uri
          pattern: ^https://
          description: Editorial logo, not an imported poster used by default. null means the frontend
            should use its generic fallback.
        participation:
          $ref: '#/components/schemas/Participation'
    InstagramPost:
      type: object
      additionalProperties: false
      required:
      - id
      - mediaType
      - publishedAt
      - permalink
      - previewImageUrl
      properties:
        id:
          type: string
          minLength: 1
          pattern: ^[0-9]+$
          description: Instagram ID represented as a string to avoid precision loss.
        mediaType:
          type: string
          enum:
          - IMAGE
          - VIDEO
          - CAROUSEL_ALBUM
        publishedAt:
          type: string
          format: date-time
        permalink:
          type: string
          format: uri
          pattern: ^https://www\.instagram\.com/(p|reel)/
        previewImageUrl:
          type: string
          format: uri
          pattern: ^https://
          description: 'Available preview: video thumbnail or image/carousel cover. May expire; null when
            no valid URL is available. Does not provide all carousel items or video playback.'
    YouTubeVideo:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - publishedAt
      - watchUrl
      - embedUrl
      - thumbnailUrl
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{11}$
        title:
          type: string
          minLength: 1
        publishedAt:
          type: string
          format: date-time
        watchUrl:
          type: string
          format: uri
          pattern: ^https://www\.youtube\.com/watch\?v=
        embedUrl:
          type: string
          format: uri
          pattern: ^https://www\.youtube-nocookie\.com/embed/
        thumbnailUrl:
          type: string
          format: uri
          pattern: ^https://
    Sponsor:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - websiteUrl
      - logoUrl
      - discountCode
      - displayOrder
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
        websiteUrl:
          type: string
          format: uri
          pattern: ^https://
        logoUrl:
          type: string
          format: uri
          pattern: ^https://
        discountCode:
          type: string
          minLength: 1
          description: Editorial athlete discount code; null when absent. Does not imply a discount percentage.
        displayOrder:
          type: integer
          minimum: 0
    Pagination:
      type: object
      additionalProperties: false
      required:
      - limit
      - offset
      - total
      - hasMore
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Filtered local collection size before pagination, not the provider total.
        hasMore:
          type: boolean
          description: true when offset + data.length < total.
    Metadata:
      type: object
      additionalProperties: false
      required:
      - athleteId
      - updatedAt
      - availability
      properties:
        athleteId:
          $ref: '#/components/schemas/Id'
        updatedAt:
          type: string
          format: date-time
          description: Last known update of the served selection or collection, including editorial decisions.
            null for legacy data with unknown acquisition time. A failed refresh does not advance this
            timestamp.
        availability:
          type: string
          enum:
          - available
          - stale
          - unknown
          description: 'available: last update succeeded within the service freshness threshold; stale:
            excessive age, failed refresh or incomplete social selection; unknown: age is unknown. Thresholds
            must be documented backend configuration. This value does not relax the exact social item
            counts.'
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - detail
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          minLength: 1
    CompetitionCollection:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      - meta
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Competition'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Metadata'
    InstagramPostCollection:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/InstagramPost'
          minItems: 3
          uniqueItems: true
          description: Exactly 3 items with distinct IDs. Duplicate IDs are invalid even if other fields
            differ.
        meta:
          $ref: '#/components/schemas/Metadata'
    YouTubeVideoCollection:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/YouTubeVideo'
          minItems: 6
          uniqueItems: true
          description: Exactly 6 items with distinct IDs. Duplicate IDs are invalid even if other fields
            differ.
        meta:
          $ref: '#/components/schemas/Metadata'
    SponsorCollection:
      type: object
      additionalProperties: false
      required:
      - data
      - pagination
      - meta
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Sponsor'
        pagination:
          $ref: '#/components/schemas/Pagination'
        meta:
          $ref: '#/components/schemas/Metadata'
